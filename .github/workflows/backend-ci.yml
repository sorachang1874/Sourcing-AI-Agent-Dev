name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The backend is PG-only: scripted/hosted/pipeline runtimes require a live
    # Postgres DSN and reject SQLite fallback. Provide a throwaway Postgres; the
    # PG fixtures create their own per-test schemas in this database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sourcing
          POSTGRES_PASSWORD: sourcing
          POSTGRES_DB: sourcing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcing -d sourcing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: sourcing-ai-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.136,<0.137" \
            "uvicorn>=0.49,<0.50" \
            "psycopg[binary]>=3.2,<3.3" \
            "psycopg-pool>=3.2,<3.4" \
            "requests>=2.33,<2.34"

      - name: Compile Python Sources
        run: |
          python -m compileall -q src tests

      - name: Run Unit Tests
        env:
          # src -> sourcing_agent package; . -> repo subdir so `scripts.*` and `tests.*` packages resolve.
          PYTHONPATH: src:.
          # PG-only control plane. The service above backs all PG fixtures and the
          # scripted/hosted/pipeline runtimes (which reject SQLite fallback).
          SOURCING_CONTROL_PLANE_POSTGRES_DSN: postgresql://sourcing:sourcing@localhost:5432/sourcing
        run: |
          python -m unittest discover -s tests -q
