name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sourcing-ai-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.136,<0.137" \
            "uvicorn>=0.49,<0.50" \
            "psycopg[binary]>=3.2,<3.3" \
            "psycopg-pool>=3.2,<3.4" \
            "requests>=2.33,<2.34"

      - name: Compile Python Sources
        run: |
          python -m compileall -q src tests

      - name: Run Unit Tests
        env:
          # src -> sourcing_agent package; . -> repo subdir so `scripts.*` and `tests.*` packages resolve.
          # No live Postgres in CI: pg_store_fixture raises unittest.SkipTest (set
          # SOURCING_REQUIRE_PG_STORE_TESTS=1 to turn those skips into hard failures).
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -q
